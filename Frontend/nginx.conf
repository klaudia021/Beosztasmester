server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend container
  location /api/ {
    proxy_pass http://server:8080;
  }

  # Everything else is the Angular app. Without this fallback,
  # refreshing on /employees/E001/edit would give a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}