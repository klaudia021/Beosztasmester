name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: ./Backend/Beosztásmester
        run: dotnet restore

      - name: Build
        working-directory: ./Backend/Beosztásmester
        run: dotnet build --no-restore --configuration Release

  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build
        working-directory: ./Frontend
        run: npm run build

  check-solver:
    name: Check Solver (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: ./Solver
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        working-directory: ./Solver
        run: python -m ruff check .

      - name: Mypy
        working-directory: ./Solver
        run: python -m mypy app tests

      - name: Pytest
        working-directory: ./Solver
        run: python -m pytest

    
